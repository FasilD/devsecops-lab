name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: devsecops-lab
  IMAGE_TAG: ci

jobs:
  build-test-security:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Configure Java and Maven cache
      # ------------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # ------------------------------------------------------------
      # 3. Run automated tests
      # ------------------------------------------------------------
      - name: Run Maven tests
        env:
          MERCHANT_USER_PASSWORD: TestUserPassword123!
          ADMIN_USER_PASSWORD: TestAdminPassword123!
        run: ./mvnw --batch-mode clean test

      # ------------------------------------------------------------
      # 4. Build the Spring Boot JAR
      # ------------------------------------------------------------
      - name: Build application
        env:
          MERCHANT_USER_PASSWORD: TestUserPassword123!
          ADMIN_USER_PASSWORD: TestAdminPassword123!
        run: ./mvnw --batch-mode package -DskipTests

      # ------------------------------------------------------------
      # 5. Prepare security report directories
      # ------------------------------------------------------------
      - name: Create report directories
        run: |
          mkdir -p reports/dependency-check
          mkdir -p reports/semgrep
          mkdir -p reports/gitleaks
          mkdir -p reports/trivy

      # ------------------------------------------------------------
      # 6. OWASP Dependency-Check SCA
      # ------------------------------------------------------------
      - name: Run OWASP Dependency-Check
        run: |
          ./mvnw --batch-mode \
            org.owasp:dependency-check-maven:check \
            -Dformat=JSON \
            -Dodc.outputDirectory=reports/dependency-check \
            -DfailBuildOnCVSS=8 \
            -DfailOnError=true

      # ------------------------------------------------------------
      # 7. Semgrep SAST
      # ------------------------------------------------------------
      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            semgrep/semgrep:latest \
            semgrep scan \
            --config auto \
            --json \
            --output /src/reports/semgrep/semgrep.json \
            /src

      # ------------------------------------------------------------
      # 8. Gitleaks secret scanning
      # ------------------------------------------------------------
      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo \
            --report-path=/repo/reports/gitleaks/gitleaks.json \
            --report-format=json \
            --no-banner

      # ------------------------------------------------------------
      # 9. Build hardened Docker image
      # ------------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      # ------------------------------------------------------------
      # 10. Scan Docker image with Trivy
      # ------------------------------------------------------------
      - name: Run Trivy vulnerability scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE/reports/trivy:/reports" \
            aquasec/trivy:0.72.0 \
            image \
            --scanners vuln \
            --format json \
            --output /reports/trivy-image.json \
            "${IMAGE_NAME}:${IMAGE_TAG}"

      # ------------------------------------------------------------
      # 11. Display vulnerability summary
      # ------------------------------------------------------------
      - name: Display security summary
        if: always()
        run: |
          echo "========================================"
          echo "DevSecOps Security Scan Summary"
          echo "========================================"

          if [ -f reports/dependency-check/dependency-check-report.json ]; then
            DEPENDENCY_VULNS=$(jq \
              '[.dependencies[]?
                | select(.vulnerabilities != null)
                | .vulnerabilities[]
              ] | length' \
              reports/dependency-check/dependency-check-report.json)

            echo "Dependency vulnerabilities: $DEPENDENCY_VULNS"
          else
            echo "Dependency-Check report not generated"
          fi

          if [ -f reports/semgrep/semgrep.json ]; then
            SEMGREP_FINDINGS=$(jq \
              '.results | length' \
              reports/semgrep/semgrep.json)

            echo "Semgrep findings: $SEMGREP_FINDINGS"
          else
            echo "Semgrep report not generated"
          fi

          if [ -f reports/gitleaks/gitleaks.json ]; then
            GITLEAKS_FINDINGS=$(jq \
              'length' \
              reports/gitleaks/gitleaks.json)

            echo "Gitleaks findings: $GITLEAKS_FINDINGS"
          else
            echo "Gitleaks report not generated"
          fi

          if [ -f reports/trivy/trivy-image.json ]; then
            TOTAL=$(jq \
              '[.Results[]?.Vulnerabilities[]?] | length' \
              reports/trivy/trivy-image.json)

            HIGH_CRITICAL=$(jq \
              '[.Results[]?.Vulnerabilities[]?
                | select(
                    .Severity == "HIGH" or
                    .Severity == "CRITICAL"
                  )
              ] | length' \
              reports/trivy/trivy-image.json)

            echo "Total container vulnerabilities: $TOTAL"
            echo "HIGH/CRITICAL container vulnerabilities: $HIGH_CRITICAL"
          else
            echo "Trivy report not generated"
          fi

          echo "========================================"

      # ------------------------------------------------------------
      # 12. Enforce container security gate
      # ------------------------------------------------------------
      - name: Enforce Trivy security gate
        run: |
          HIGH_CRITICAL=$(jq \
            '[.Results[]?.Vulnerabilities[]?
              | select(
                  .Severity == "HIGH" or
                  .Severity == "CRITICAL"
                )
            ] | length' \
            reports/trivy/trivy-image.json)

          if [ "$HIGH_CRITICAL" -gt 0 ]; then
            echo "Security gate failed."
            echo "$HIGH_CRITICAL HIGH or CRITICAL vulnerabilities found."
            exit 1
          fi

          echo "Security gate passed."
          echo "No HIGH or CRITICAL vulnerabilities found."

      # ------------------------------------------------------------
      # 13. Upload application JAR
      # ------------------------------------------------------------
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-lab-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

      # ------------------------------------------------------------
      # 14. Upload security reports
      # Runs even when an earlier security step fails
      # ------------------------------------------------------------
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/dependency-check/*.json
            reports/semgrep/*.json
            reports/gitleaks/*.json
            reports/trivy/*.json
          if-no-files-found: warn
          retention-days: 7