name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: devsecops-lab
  IMAGE_TAG: ci

jobs:
  build-test-security:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Configure Java and Maven cache
      # ------------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # ------------------------------------------------------------
      # 3. Generate temporary CI credentials
      # ------------------------------------------------------------
      - name: Generate temporary CI credentials
        shell: bash
        run: |
          MERCHANT_PASSWORD="$(openssl rand -base64 32 | tr -d '\n')"
          ADMIN_PASSWORD="$(openssl rand -base64 32 | tr -d '\n')"

          echo "::add-mask::$MERCHANT_PASSWORD"
          echo "::add-mask::$ADMIN_PASSWORD"

          echo "MERCHANT_USER_PASSWORD=$MERCHANT_PASSWORD" >> "$GITHUB_ENV"
          echo "ADMIN_USER_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 4. Run automated tests
      # ------------------------------------------------------------
      - name: Run Maven tests
        run: ./mvnw --batch-mode clean test

      # ------------------------------------------------------------
      # 5. Build the Spring Boot JAR
      # ------------------------------------------------------------
      - name: Build application
        run: ./mvnw --batch-mode package -DskipTests

      # ------------------------------------------------------------
      # 6. Prepare security report directories
      # ------------------------------------------------------------
      - name: Create report directories
        run: |
          mkdir -p reports/dependency-check
          mkdir -p reports/semgrep
          mkdir -p reports/gitleaks
          mkdir -p reports/trivy
          mkdir -p reports/zap

      # ------------------------------------------------------------
      # 7. Cache OWASP Dependency-Check data
      # ------------------------------------------------------------
      - name: Cache Dependency-Check database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      # ------------------------------------------------------------
      # 8. OWASP Dependency-Check SCA
      # ------------------------------------------------------------
      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY GitHub secret is missing or empty."
            exit 1
          fi

          echo "NVD API key is available."

          ./mvnw --batch-mode \
            org.owasp:dependency-check-maven:12.2.2:check \
            -Dformat=JSON \
            -Dodc.outputDirectory=reports/dependency-check \
            -DfailBuildOnCVSS=8 \
            -DfailOnError=true \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            -DnvdApiDelay=6000 \
            -DnvdMaxRetryCount=20

      # ------------------------------------------------------------
      # 9. Semgrep SAST
      # ------------------------------------------------------------
      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            semgrep/semgrep:latest \
            semgrep scan \
            --config auto \
            --json \
            --output /src/reports/semgrep/semgrep.json \
            /src

      # ------------------------------------------------------------
      # 10. Gitleaks secret scanning
      # ------------------------------------------------------------
      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo \
            --report-path=/repo/reports/gitleaks/gitleaks.json \
            --report-format=json \
            --no-banner

      # ------------------------------------------------------------
      # 11. Build hardened Docker image
      # ------------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      # ------------------------------------------------------------
      # 12. Scan Docker image with Trivy
      # ------------------------------------------------------------
      - name: Run Trivy vulnerability scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE/reports/trivy:/reports" \
            aquasec/trivy:0.72.0 \
            image \
            --scanners vuln \
            --format json \
            --output /reports/trivy-image.json \
            "${IMAGE_NAME}:${IMAGE_TAG}"

      # ------------------------------------------------------------
      # 13. Display security scan summary
      # ------------------------------------------------------------
      - name: Display security summary
        if: always()
        run: |
          echo "========================================"
          echo "DevSecOps Security Scan Summary"
          echo "========================================"

          if [ -f reports/dependency-check/dependency-check-report.json ]; then
            DEPENDENCY_VULNS=$(jq \
              '[.dependencies[]?
                | select(.vulnerabilities != null)
                | .vulnerabilities[]
              ] | length' \
              reports/dependency-check/dependency-check-report.json)

            echo "Dependency vulnerabilities: $DEPENDENCY_VULNS"
          else
            echo "Dependency-Check report not generated"
          fi

          if [ -f reports/semgrep/semgrep.json ]; then
            SEMGREP_FINDINGS=$(jq \
              '.results | length' \
              reports/semgrep/semgrep.json)

            echo "Semgrep findings: $SEMGREP_FINDINGS"
          else
            echo "Semgrep report not generated"
          fi

          if [ -f reports/gitleaks/gitleaks.json ]; then
            GITLEAKS_FINDINGS=$(jq \
              'length' \
              reports/gitleaks/gitleaks.json)

            echo "Gitleaks findings: $GITLEAKS_FINDINGS"
          else
            echo "Gitleaks report not generated"
          fi

          if [ -f reports/trivy/trivy-image.json ]; then
            TOTAL=$(jq \
              '[.Results[]?.Vulnerabilities[]?] | length' \
              reports/trivy/trivy-image.json)

            HIGH_CRITICAL=$(jq \
              '[.Results[]?.Vulnerabilities[]?
                | select(
                    .Severity == "HIGH" or
                    .Severity == "CRITICAL"
                  )
              ] | length' \
              reports/trivy/trivy-image.json)

            echo "Total container vulnerabilities: $TOTAL"
            echo "HIGH/CRITICAL container vulnerabilities: $HIGH_CRITICAL"
          else
            echo "Trivy report not generated"
          fi

          echo "========================================"

      # ------------------------------------------------------------
      # 14. Enforce Trivy security gate
      # ------------------------------------------------------------
      - name: Enforce Trivy security gate
        run: |
          HIGH_CRITICAL=$(jq \
            '[.Results[]?.Vulnerabilities[]?
              | select(
                  .Severity == "HIGH" or
                  .Severity == "CRITICAL"
                )
            ] | length' \
            reports/trivy/trivy-image.json)

          if [ "$HIGH_CRITICAL" -gt 0 ]; then
            echo "Security gate failed."
            echo "$HIGH_CRITICAL HIGH or CRITICAL vulnerabilities found."
            exit 1
          fi

          echo "Security gate passed."
          echo "No HIGH or CRITICAL vulnerabilities found."

      # ------------------------------------------------------------
      # 15. Start application container for DAST
      # ------------------------------------------------------------
      - name: Start application container
        run: |
          docker run -d \
            --name devsecops-lab-dast \
            -p 127.0.0.1:8080:8080 \
            -e MERCHANT_USER_PASSWORD="$MERCHANT_USER_PASSWORD" \
            -e ADMIN_USER_PASSWORD="$ADMIN_USER_PASSWORD" \
            "${IMAGE_NAME}:${IMAGE_TAG}"

      # ------------------------------------------------------------
      # 16. Wait for application to become healthy
      # ------------------------------------------------------------
      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:8080/actuator/health; then
              echo
              echo "Application is ready for DAST."
              exit 0
            fi

            echo "Waiting for application... attempt ${attempt}/30"
            sleep 5
          done

          echo "Application did not become healthy."
          docker logs devsecops-lab-dast
          exit 1
      # ------------------------------------------------------------
      # 17. Download OpenAPI specification
      # ------------------------------------------------------------
      - name: Download OpenAPI specification
        run: |
          mkdir -p reports/openapi

          curl --fail --silent \
            --user "merchant-user:$MERCHANT_USER_PASSWORD" \
            http://127.0.0.1:8080/v3/api-docs \
            --output reports/openapi/openapi.json

          jq empty reports/openapi/openapi.json

          echo "Imported API paths:"
          jq '.paths | keys' reports/openapi/openapi.json
      # ------------------------------------------------------------
      # 18. Run authenticated OWASP ZAP API scan
      # ------------------------------------------------------------
      - name: Run authenticated OWASP ZAP API scan
        run: |
          mkdir -p reports/zap-api
          chmod 777 reports/zap-api

          ZAP_BASIC_AUTH="Basic $(printf 'merchant-user:%s' \
            "$MERCHANT_USER_PASSWORD" | base64 -w 0)"

          echo "::add-mask::$ZAP_BASIC_AUTH"

          docker run --rm \
            --network host \
            -e ZAP_AUTH_HEADER_VALUE="$ZAP_BASIC_AUTH" \
            -e ZAP_AUTH_HEADER_SITE="127.0.0.1" \
            -v "$GITHUB_WORKSPACE/reports/openapi:/zap/openapi:ro" \
            -v "$GITHUB_WORKSPACE/reports/zap-api:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t /zap/openapi/openapi.json \
            -f openapi \
            -O 127.0.0.1:8080 \
            -J zap-api-report.json \
            -r zap-api-report.html \
            -w zap-api-report.md \
            -I

          echo "Generated authenticated ZAP reports:"
          ls -la reports/zap-api
      # ------------------------------------------------------------
      # 19. Run OWASP ZAP baseline DAST
      # ------------------------------------------------------------
      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p reports/zap
          chmod 777 reports/zap

          docker run --rm \
            --network host \
            -v "$GITHUB_WORKSPACE/reports/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8080/actuator/health \
            -J zap-report.json \
            -r zap-report.html \
            -w zap-report.md \
            -I

          echo "Generated ZAP files:"
          ls -la reports/zap

      # ------------------------------------------------------------
      # 20. Stop DAST application container
      # ------------------------------------------------------------
      - name: Stop application container
        if: always()
        run: |
          docker logs devsecops-lab-dast || true
          docker rm -f devsecops-lab-dast || true

      # ------------------------------------------------------------
      # 21. Upload application JAR
      # ------------------------------------------------------------
      - name: Upload application artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-lab-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

      # ------------------------------------------------------------
      # 22. Upload security reports
      # Runs even when an earlier security step fails
      # ------------------------------------------------------------
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/dependency-check/*.json
            reports/semgrep/*.json
            reports/gitleaks/*.json
            reports/trivy/*.json
            reports/zap/*
          if-no-files-found: warn
          retention-days: 7
